        <script>
            class Card{
                constructor(name, traits, elixir, hasAbility, position, image){
                    this.name = name;
                    this.traits = traits;
                    this.elixir = elixir;
                    this.hasAbility = hasAbility;
                    this.position = position;
                    this.image = image;
                }

                toString(){
                    return `<Card {${this.name}, ${this.traits}, ${this.elixir} elixir}>`
                }
            }

            class Deck{
                constructor(cards){
                    this.cards = cards;
                }

                getCardNames(){
                    let names = [];
                    for (const c of this.cards){
                        names.push(c.name);
                    }
                    return names;
                }

                getElixirCost(){
                    let elixirCost = 0;
                    for (const c of this.cards){
                        elixirCost += c.elixir;
                    }
                    return elixirCost;
                }

                getTraits(){
                    let currentTraits = {};
                    for (const c of this.cards){
                        for (const t of c.traits){
                            if (t in currentTraits){
                                currentTraits[t] += 1;
                            } else {
                                currentTraits[t] = 1;
                            }
                        }
                    }
                    return currentTraits;
                }

                getActivatedTraits(){
                    let activeTraits = {};
                    let currentTraits = this.getTraits();
                    for (const t in currentTraits){
                        if(traits[t]["min"] <= currentTraits[t]){
                            activeTraits[t] = currentTraits[t];
                        }
                    }
                    return activeTraits;
                }

                getLevel2Traits(){
                    let level2Traits = {};
                    let activeTraits = this.getActivatedTraits();
                    for (const t in activeTraits){
                        if(traits[t]["max"] <= activeTraits[t]){
                            level2Traits[t] = activeTraits[t];
                        }
                    }
                    return level2Traits;
                }

                getPositions(){
                    let positions = {"front":0,"back":0};
                    for (const c of this.cards){
                        positions[c.position] += 1;
                    }
                    return positions;
                }
                
                getAbilities(){
                    let abilities = 0;
                    for (const c of this.cards){
                        if(c.hasAbility){
                            abilities++;
                        }
                    }
                    return abilities;
                }

                toString(){
                    return `<Deck {${this.cards}}>`;
                }
            }

                    for (let a = 0; a < troops.length - (numCardsV-1); a++){

                            for (let b = (a+1); b < troops.length - (numCardsV-2); b++){
                                if(numCardsV > 2){
                                    for (let c = (b+1); c < troops.length - (numCardsV-3); c++){
                                        if(numCardsV > 3){
                                            for (let d = (c+1); d < troops.length - (numCardsV-4); d++){
                                                if(numCardsV > 4){
                                                    for (let e = (d+1); e < troops.length - (numCardsV-5); e++){
                                                        if(numCardsV > 5){
                                                            for (let f = (e+1); f < troops.length - (numCardsV-6); f++){
                                                                if(numCardsV > 6){
                                                                    for (let g = (f+1); g < troops.length - (numCardsV-7); g++){
                                                                        let nextTroops = [troops[a],troops[b],troops[c],troops[d],troops[e],troops[f],troops[g]];
                                                                        if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                                                            nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                                                        }
                                                                        let nextDeck = new Deck(nextTroops);
                                                                        if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                                                            allDecks.push(nextDeck);
                                                                        }
                                                                    }
                                                                } else {
                                                                    let nextTroops = [troops[a],troops[b],troops[c],troops[d],troops[e],troops[f]];
                                                                    if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                                                        nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                                                    }
                                                                    let nextDeck = new Deck(nextTroops);
                                                                    if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                                                        allDecks.push(nextDeck);
                                                                    }
                                                                }
                                                            }
                                                        } else {
                                                            let nextTroops = [troops[a],troops[b],troops[c],troops[d],troops[e]];
                                                            if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                                                nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                                            }
                                                            let nextDeck = new Deck(nextTroops);
                                                            if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                                                allDecks.push(nextDeck);
                                                            }
                                                        }
                                                    }
                                                } else {
                                                    let nextTroops = [troops[a],troops[b],troops[c],troops[d]];
                                                    if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                                        nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                                    }
                                                    let nextDeck = new Deck(nextTroops);
                                                    if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                                        allDecks.push(nextDeck);
                                                    }
                                                }
                                            }
                                        } else {
                                            let nextTroops = [troops[a],troops[b],troops[c]];
                                            if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                                nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                            }
                                            let nextDeck = new Deck(nextTroops);
                                            if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                                allDecks.push(nextDeck);
                                            }
                                        }
                                    }
                                } else {
                                    let nextTroops = [troops[a],troops[b]];
                                    if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                        nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                                    }
                                    let nextDeck = new Deck(nextTroops);
                                    if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                        allDecks.push(nextDeck);
                                    }
                                }
                            }
                        } else {
                            let nextTroops = [troops[a]];
                            if(dummyTrait1V != "none" || dummyTrait2V != "none"){
                                nextTroops.push(new Card("dummy", [dummyTrait1V,dummyTrait2V],0,false,"none",""));
                            }
                            let nextDeck = new Deck(nextTroops);
                            if(Object.keys(nextDeck.getActivatedTraits()).length > 0){
                                allDecks.push(nextDeck);
                            }
                        }
                    }
                }
                
                for (const deck of allDecks){
                    if((card1V == "none" || deck.getCardNames().includes(card1V)) &&
                       (card2V == "none" || deck.getCardNames().includes(card2V)) &&
                       (card3V == "none" || deck.getCardNames().includes(card3V)) &&
                       (card4V == "none" || deck.getCardNames().includes(card4V)) &&
                       (card5V == "none" || deck.getCardNames().includes(card5V)) &&
                       (card6V == "none" || deck.getCardNames().includes(card6V)) &&
                       (numLevel2TraitsV == 0 || numLevel2TraitsV <= Object.keys(deck.getLevel2Traits()).length) &&
                       (numTraitsV == 0 || numTraitsV <= Object.keys(deck.getActivatedTraits()).length) &&
                       (trait1V == "none" || trait1V in deck.getActivatedTraits()) &&
                       (trait2V == "none" || trait2V in deck.getActivatedTraits()) &&
                       (trait3V == "none" || trait3V in deck.getActivatedTraits()) &&
                       (trait4V == "none" || trait4V in deck.getActivatedTraits()) &&
                       (trait5V == "none" || trait5V in deck.getActivatedTraits()) &&
                       (maxTrait1V == "none" || maxTrait1V in deck.getLevel2Traits()) &&
                       (maxTrait2V == "none" || maxTrait2V in deck.getLevel2Traits())){
                        decksToDisplay.push(deck);
                    }
                }
                
                for (const deck of decksToDisplay.sort((a,b) => {
                        aL2Traits = Object.keys(a.getLevel2Traits()).length;
                        bL2Traits = Object.keys(b.getLevel2Traits()).length;
                        aTraits = Object.keys(a.getActivatedTraits()).length - aL2Traits;
                        bTraits = Object.keys(b.getActivatedTraits()).length - bL2Traits;
                        if((2.1*aL2Traits)+aTraits != (2.1*bL2Traits)+bTraits){
                            return ((2.1*bL2Traits)+bTraits) - ((2.1*aL2Traits)+aTraits);
                        } else {
                            return a.getElixirCost() - b.getElixirCost();
                        }
                    }).slice(0,20)){
                    const deckDiv = document.createElement("div");
                    for (const card of deck.cards){
                        if(card.name != "dummy"){
                            const cardDisplay = document.createElement("span");
                            cardDisplay.id = card.name;
                            const cardImage = document.createElement("img");
                            cardImage.className = "cardImage";
                            cardImage.src = card.image;
                            cardDisplay.appendChild(cardImage);
                            deckDiv.appendChild(cardDisplay);
                        }
                    }
                    const maxedTraitPrefix = document.createElement("span");
                    maxedTraitPrefix.innerText = "maxed:";
                    deckDiv.appendChild(maxedTraitPrefix);
                    for (const trait in deck.getLevel2Traits()){
                        const traitDisplay = document.createElement("span");
                        traitDisplay.id = trait;
                        const traitImage = document.createElement("img");
                        traitImage.className = "traitImage";
                        traitImage.src = traits[trait]["image"];
                        traitDisplay.appendChild(traitImage);
                        deckDiv.appendChild(traitDisplay);
                    }
                    const traitDevider = document.createElement("span");
                    traitDevider.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                    deckDiv.appendChild(traitDevider);
                    const notMaxedTraitPrefix = document.createElement("span");
                    notMaxedTraitPrefix.innerText = "active:";
                    deckDiv.appendChild(notMaxedTraitPrefix);
                    for (const trait in deck.getActivatedTraits()){
                        if(!(trait in deck.getLevel2Traits())){
                            const traitDisplay = document.createElement("span");
                            traitDisplay.id = trait;
                            const traitImage = document.createElement("img");
                            traitImage.className = "traitImage";
                            traitImage.src = traits[trait]["image"];
                            traitDisplay.appendChild(traitImage);
                            deckDiv.appendChild(traitDisplay);
                        }
                    }
                    const elixirDevider = document.createElement("span");
                    elixirDevider.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                    deckDiv.appendChild(elixirDevider);
                    const elixirCostText = document.createElement("span");
                    elixirCostText.innerText = `elixir cost: ${deck.getElixirCost()}`;
                    deckDiv.appendChild(elixirCostText);
                    
                    const abilitiesDevider = document.createElement("span");
                    abilitiesDevider.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                    deckDiv.appendChild(abilitiesDevider);
                    const abilitiesText = document.createElement("span");
                    abilitiesText.innerText = `special abilities: ${deck.getAbilities()}`;
                    deckDiv.appendChild(abilitiesText);
                    
                    const positionsDevider = document.createElement("span");
                    positionsDevider.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                    deckDiv.appendChild(positionsDevider);
                    const positionsText = document.createElement("span");
                    positionsV = deck.getPositions();
                    positionsText.innerText = `front/back: ${positionsV.front}/${positionsV.back}`;
                    deckDiv.appendChild(positionsText);

                    deckDisplayDiv.appendChild(deckDiv);
                }
            }

            console.log(allDecks.length);

        </script>
